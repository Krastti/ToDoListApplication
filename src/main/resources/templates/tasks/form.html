<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новая задача</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>Создать задачу</h1>
    <p class="subtitle" th:text="'project #' + ${projectId}"></p>

    <div class="form-panel">
        <form th:action="@{/projects/{projectId}/tasks/new(projectId=${projectId})}"
              th:object="${task}"
              method="post">

            <div class="field">
                <label>Название</label>
                <input type="text" th:field="*{title}">
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="field">
                <label>Описание</label>
                <textarea th:field="*{description}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="field">
                <label>Статус</label>
                <select th:field="*{status}">
                    <option value="TODO">TODO</option>
                    <option value="IN_PROGRESS">IN_PROGRESS</option>
                    <option value="DONE">DONE</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
            </div>

            <div class="field">
                <label>Дедлайн</label>
                <input type="date" th:field="*{deadline}">
                <span class="field-error" th:if="${#fields.hasErrors('deadline')}" th:errors="*{deadline}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Создать</button>
                <a class="cancel-link" th:href="@{/projects/{projectId}/tasks(projectId=${projectId})}">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
