<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список проектов</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>Мои проекты</h1>
    <p class="subtitle" th:text="${#lists.size(projects)} + ' project(s)'"></p>

    <div class="toolbar">
        <a class="btn" href="/projects/new">+ Создать проект</a>
    </div>

    <table class="task-table" th:if="${not #lists.isEmpty(projects)}">
        <thead>
        <tr>
            <th>Название</th>
            <th>Описание</th>
            <th>Создан</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="project : ${projects}">
            <td class="title" th:text="${project.name}"></td>
            <td class="description" th:text="${project.description}"></td>
            <td class="deadline" th:text="${project.createdAt}"></td>
            <td class="actions">
                <a th:href="@{/projects/{id}(id=${project.id})}">Открыть</a>
                <a th:href="@{/projects/{id}/edit(id=${project.id})}">Редактировать</a>
                <form th:action="@{/projects/{id}/delete(id=${project.id})}" method="post">
                    <button type="submit" class="btn-danger">Удалить</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="empty-state" th:if="${#lists.isEmpty(projects)}">
        Проектов пока нет — создайте первый.
    </div>
</div>
</body>
</html>
