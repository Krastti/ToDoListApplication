<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Новый проект</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page">
    <h1>Создать проект</h1>

    <div class="form-panel">
        <form th:action="@{/projects/new}"
              th:object="${project}"
              method="post">

            <div class="field">
                <label>Название</label>
                <input type="text" th:field="*{name}">
                <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="field">
                <label>Описание</label>
                <textarea th:field="*{description}"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn">Создать</button>
                <a class="cancel-link" href="/projects">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
